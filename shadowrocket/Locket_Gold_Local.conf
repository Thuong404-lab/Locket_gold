# Experimental local response rewrite. Not verified on iPhone.
# No proxy server, shared CA certificate, DNS override, or account credentials.
# Script URLs become usable only after these files are published to this repo.

[Rule]
FINAL,DIRECT

[Script]
locket_gold_request = type=http-request, pattern=^https:\/\/api\.revenuecat\.com\/v1\/(subscribers\/[^/?]+|receipts)\/?(\?.*)?$, script-path=https://raw.githubusercontent.com/Thuong404-lab/Locket_gold/main/shadowrocket/locket-gold-local.js, timeout=10, argument="enabled=true"
locket_gold_response = type=http-response, pattern=^https:\/\/api\.revenuecat\.com\/v1\/(subscribers\/[^/?]+|receipts)\/?(\?.*)?$, script-path=https://raw.githubusercontent.com/Thuong404-lab/Locket_gold/main/shadowrocket/locket-gold-local.js, requires-body=true, max-size=1048576, timeout=10, argument="enabled=true"

[MITM]
enable = true
hostname = api.revenuecat.com
